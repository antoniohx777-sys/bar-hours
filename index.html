<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bar Hours">
<title>Bar Hours</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505; --panel:#0e0c0a; --line:#2a1a0c;
  --o:#ff7a1a; --o2:#ffb347; --o-dim:#7a3a0c;
  --txt:#f6efe8; --mut:#8a7f76;
  --glow:0 0 12px rgba(255,122,26,.55),0 0 32px rgba(255,122,26,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100%}
body{
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px);
  background:
    radial-gradient(120% 60% at 50% -10%,rgba(255,122,26,.18),transparent 60%),
    radial-gradient(80% 40% at 100% 110%,rgba(255,122,26,.10),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  overscroll-behavior:none;
}
.wrap{max-width:460px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font-weight:700;letter-spacing:.18em;font-size:12px;color:var(--o);text-transform:uppercase;text-shadow:var(--glow)}
.rate-pill{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--o2);border:1px solid var(--o-dim);border-radius:999px;padding:6px 10px;background:rgba(255,122,26,.06)}
.card{background:linear-gradient(180deg,rgba(255,122,26,.05),rgba(255,122,26,0) 40%),var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 0 0 1px rgba(255,122,26,.04),0 20px 50px -20px rgba(255,122,26,.25)}
.month-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-bar h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.month-bar h1 span{color:var(--o);text-shadow:var(--glow)}
.nav{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#0a0806;color:var(--o);font-size:18px;display:grid;place-items:center;cursor:pointer}
.nav:active{transform:scale(.94);box-shadow:var(--glow)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow div{text-align:center;font-size:10px;letter-spacing:.12em;color:var(--mut);padding-bottom:6px;text-transform:uppercase}
.day{aspect-ratio:1/1.12;border-radius:12px;border:1px solid #1a130d;background:#090706;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px 5px;cursor:pointer;position:relative;transition:transform .12s,box-shadow .2s,border-color .2s}
.day:active{transform:scale(.93)}
.day .n{font-size:12px;color:var(--mut);font-weight:500}
.day .h{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:transparent}
.day.empty{visibility:hidden}
.day.today{border-color:var(--o-dim)}
.day.today .n{color:var(--o)}
.day.has{border-color:var(--o);background:radial-gradient(circle at 50% 30%,rgba(255,122,26,.30),rgba(255,122,26,.06) 70%),#0d0805;box-shadow:inset 0 0 12px rgba(255,122,26,.25),0 0 14px rgba(255,122,26,.30)}
.day.has .n{color:var(--txt)}
.day.has .h{color:var(--o2);text-shadow:0 0 8px rgba(255,160,60,.8)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:#0a0806;border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.stat .v{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;margin-top:4px}
.calc{margin-top:14px}
.calc h2{margin:0 0 12px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--o)}
.hours-total{text-align:center;padding:14px 10px 16px;margin-bottom:12px;border-radius:18px;border:1px solid var(--o-dim);background:radial-gradient(100% 120% at 50% 0%,rgba(255,122,26,.16),rgba(255,122,26,.02) 70%),#0a0705;box-shadow:inset 0 0 20px rgba(255,122,26,.08)}
.hours-total small{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--o2)}
.hours-total .hbig{font-family:'JetBrains Mono',monospace;font-size:38px;font-weight:700;color:var(--o2);text-shadow:0 0 10px rgba(255,140,40,.7),0 0 26px rgba(255,122,26,.4);line-height:1.15;margin-top:2px}
.hours-total .hbig em{font-style:normal;font-size:20px;margin-left:4px;color:var(--o)}
.hours-total .hsub{font-size:12px;color:var(--mut);margin-top:2px}
.eq{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:'JetBrains Mono',monospace}
.eq .box{flex:1;text-align:center;background:#0a0806;border:1px solid var(--line);border-radius:14px;padding:10px 4px}
.eq .box small{display:block;font-family:'Space Grotesk';font-size:9px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;margin-bottom:4px}
.eq .box b{font-size:17px}
.eq .op{color:var(--o);font-size:18px}
.total{margin-top:14px;text-align:center;padding:18px 10px;border-radius:18px;border:1px solid var(--o);background:radial-gradient(100% 120% at 50% 0%,rgba(255,122,26,.28),rgba(255,122,26,.04) 70%),#0b0704;box-shadow:var(--glow),inset 0 0 30px rgba(255,122,26,.15)}
.total small{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--o2)}
.total .big{font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:700;color:#fff;text-shadow:0 0 10px rgba(255,140,40,.9),0 0 30px rgba(255,122,26,.6);margin-top:4px;line-height:1.1}
.quick{margin-top:14px}
.quick label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.quick-row{display:flex;gap:8px;margin-top:6px;align-items:center}
.quick input{flex:1;min-width:0;background:#0a0806;border:1px solid var(--line);border-radius:12px;color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:16px;padding:12px}
.quick input:focus{outline:none;border-color:var(--o);box-shadow:var(--glow)}
.quick .out{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--o2);min-width:96px;text-align:right;font-size:16px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);padding:0 12px calc(env(safe-area-inset-bottom) + 12px)}
.sheet:not(.on){visibility:hidden;transition:transform .28s cubic-bezier(.2,.9,.3,1),visibility 0s .28s}
.sheet.on{transform:none}
.sheet .inner{max-width:460px;margin:0 auto;background:#0d0a07;border:1px solid var(--o-dim);border-radius:24px;padding:18px 16px 16px;box-shadow:0 -10px 40px rgba(255,122,26,.25)}
.grab{width:40px;height:4px;border-radius:4px;background:#3a2412;margin:-6px auto 12px}
.sheet h3{margin:0;font-size:18px}
.sheet .sub{color:var(--mut);font-size:12px;margin-top:2px}
.stepper{display:flex;align-items:center;justify-content:space-between;margin:18px 0 14px}
.stepper button{width:62px;height:62px;border-radius:18px;border:1px solid var(--o-dim);background:#120c07;color:var(--o);font-size:28px;cursor:pointer}
.stepper button:active{box-shadow:var(--glow);transform:scale(.95)}
.stepper .val{text-align:center}
.stepper .val b{display:block;font-family:'JetBrains Mono',monospace;font-size:46px;color:#fff;text-shadow:0 0 12px rgba(255,140,40,.8)}
.stepper .val span{font-size:12px;color:var(--o2);font-family:'JetBrains Mono',monospace}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{padding:10px 0;border-radius:12px;border:1px solid var(--line);background:#0a0806;color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:14px;cursor:pointer}
.chip.sel{border-color:var(--o);color:var(--o2);box-shadow:0 0 10px rgba(255,122,26,.4)}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:14px}
.btn{padding:15px;border-radius:14px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;border:1px solid var(--line);background:#0a0806;color:var(--mut)}
.btn.primary{border:none;color:#140800;background:linear-gradient(180deg,#ffa04a,#ff6a00);box-shadow:var(--glow)}
.btn:active{transform:scale(.97)}
.foot{text-align:center;color:#4d443d;font-size:11px;margin-top:18px}
.foot button{background:none;border:none;color:var(--mut);text-decoration:underline;font:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">● Bar Hours</div>
    <div class="rate-pill" id="ratePill">€9.50 / h</div>
  </header>

  <section class="card">
    <div class="month-bar">
      <button class="nav" id="prev" aria-label="Previous month">‹</button>
      <h1 id="title"></h1>
      <button class="nav" id="next" aria-label="Next month">›</button>
    </div>
    <div class="dow"><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div><div>Su</div></div>
    <div class="grid" id="grid"></div>
    <div class="stats">
      <div class="stat"><div class="l">Shifts</div><div class="v" id="shifts">0</div></div>
      <div class="stat"><div class="l">Avg shift</div><div class="v" id="avg">0 h</div></div>
    </div>
  </section>

  <section class="card calc">
    <h2>Calculator · this month</h2>
    <div class="hours-total">
      <small>Total hours</small>
      <div class="hbig"><span id="tHours">0</span><em>h</em></div>
      <div class="hsub" id="tSub">0 shifts logged</div>
    </div>
    <div class="eq">
      <div class="box"><small>Hours</small><b id="cHours">0</b></div>
      <div class="op">×</div>
      <div class="box"><small>Rate</small><b>€9.50</b></div>
    </div>
    <div class="total">
      <small>You earned</small>
      <div class="big" id="cTotal">€0.00</div>
    </div>
    <div class="quick">
      <label for="qIn">Quick calc — any hours</label>
      <div class="quick-row">
        <input id="qIn" type="number" inputmode="decimal" step="0.5" min="0" placeholder="e.g. 6.5">
        <div class="out" id="qOut">€0.00</div>
      </div>
    </div>
  </section>

  <div class="foot">Saved on this phone · <button id="exportBtn">Back up</button> · <button id="importBtn">Restore</button></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="inner">
    <div class="grab"></div>
    <h3 id="sTitle">Day</h3>
    <div class="sub">Tap +/- in half hours or pick a quick value</div>
    <div class="stepper">
      <button id="minus" aria-label="Minus half hour">−</button>
      <div class="val"><b id="sVal">0</b><span id="sEur">€0.00</span></div>
      <button id="plus" aria-label="Plus half hour">+</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="actions">
      <button class="btn" id="clear">Clear</button>
      <button class="btn primary" id="save">Save</button>
    </div>
  </div>
</div>

<script>
const RATE = 9.5;
const KEY = 'barHours.v1';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const eur = n => '€' + n.toLocaleString('en-IE',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtH = n => (Math.round(n*10)/10).toString();

let data = {};
try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { data = {}; }
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e) {} };

const now = new Date();
let view = new Date(now.getFullYear(), now.getMonth(), 1);
let editKey = null, editVal = 0;
const pad = n => String(n).padStart(2,'0');
const keyOf = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;

function render(){
  const y = view.getFullYear(), m = view.getMonth();
  document.getElementById('title').innerHTML = `${MONTHS[m]} <span>${y}</span>`;
  const grid = document.getElementById('grid'); grid.innerHTML = '';
  const offset = (new Date(y,m,1).getDay() + 6) % 7;
  const days = new Date(y,m+1,0).getDate();
  for (let i=0;i<offset;i++){ const e=document.createElement('div'); e.className='day empty'; grid.appendChild(e); }
  let total = 0, shifts = 0;
  for (let d=1; d<=days; d++){
    const k = keyOf(y,m,d), h = data[k] || 0;
    if (h>0){ total += h; shifts++; }
    const el = document.createElement('button');
    el.className = 'day' + (h>0?' has':'') + (y===now.getFullYear()&&m===now.getMonth()&&d===now.getDate()?' today':'');
    el.innerHTML = `<span class="n">${d}</span><span class="h">${h>0?fmtH(h)+'h':'·'}</span>`;
    el.onclick = () => openSheet(k, d, m, y);
    grid.appendChild(el);
  }
  document.getElementById('shifts').textContent = shifts;
  document.getElementById('avg').textContent = (shifts? fmtH(total/shifts):0) + ' h';
  document.getElementById('cHours').textContent = fmtH(total);
  document.getElementById('tHours').textContent = fmtH(total);
  document.getElementById('tSub').textContent = `${shifts} shift${shifts===1?'':'s'} logged in ${MONTHS[m]}`;
  document.getElementById('cTotal').textContent = eur(total*RATE);
}

const QUICK = [4,5,6,6.5,7,7.5,8,8.5,9,10];
function openSheet(k,d,m,y){
  editKey = k; editVal = data[k] || 0;
  const wd = new Date(y,m,d).toLocaleDateString('en-GB',{weekday:'long'});
  document.getElementById('sTitle').textContent = `${wd}, ${d} ${MONTHS[m]}`;
  updSheet();
  document.getElementById('scrim').classList.add('on');
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
}
function updSheet(){
  document.getElementById('sVal').textContent = fmtH(editVal);
  document.getElementById('sEur').textContent = eur(editVal*RATE);
  const c = document.getElementById('chips'); c.innerHTML='';
  QUICK.forEach(q=>{
    const b=document.createElement('button'); b.className='chip'+(q===editVal?' sel':''); b.textContent=q;
    b.onclick=()=>{ editVal=q; updSheet(); }; c.appendChild(b);
  });
}
document.getElementById('plus').onclick = () => { editVal = Math.min(24, editVal+0.5); updSheet(); };
document.getElementById('minus').onclick = () => { editVal = Math.max(0, editVal-0.5); updSheet(); };
document.getElementById('save').onclick = () => { if(editVal>0) data[editKey]=editVal; else delete data[editKey]; persist(); render(); closeSheet(); };
document.getElementById('clear').onclick = () => { delete data[editKey]; persist(); render(); closeSheet(); };
document.getElementById('scrim').onclick = closeSheet;
document.getElementById('prev').onclick = () => { view = new Date(view.getFullYear(), view.getMonth()-1, 1); render(); };
document.getElementById('next').onclick = () => { view = new Date(view.getFullYear(), view.getMonth()+1, 1); render(); };

// swipe months
let sx=null;
document.getElementById('grid').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
document.getElementById('grid').addEventListener('touchend',e=>{ if(sx===null)return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>60){ (dx<0?document.getElementById('next'):document.getElementById('prev')).click(); } sx=null; },{passive:true});

const qIn = document.getElementById('qIn');
qIn.addEventListener('input',()=>{ const v=parseFloat(qIn.value.replace(',','.'))||0; document.getElementById('qOut').textContent=eur(v*RATE); });

// backup / restore via copy-paste code
document.getElementById('exportBtn').onclick = async () => {
  const s = JSON.stringify(data);
  try { await navigator.clipboard.writeText(s); alert('Backup copied — paste it somewhere safe (Notes).'); }
  catch(e){ prompt('Copy this backup:', s); }
};
document.getElementById('importBtn').onclick = () => {
  const s = prompt('Paste your backup code:');
  if(!s) return;
  try { const d = JSON.parse(s); if(typeof d==='object'){ data = d; persist(); render(); alert('Restored ✓'); } }
  catch(e){ alert('That backup code didn\'t work.'); }
};

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
